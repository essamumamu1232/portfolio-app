name: LedgerLine CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'ledger-line/**'
  pull_request:
    branches: [main]
    paths:
      - 'ledger-line/**'

jobs:
  lint-test-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ledger-line/package-lock.json
      - run: npm ci
        working-directory: ledger-line
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: ledger-line
      - run: npm run build
        working-directory: ledger-line
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ledger-line/dist/

  docker:
    name: Build & Push Docker Image
    needs: lint-test-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./ledger-line
          file: ./ledger-line/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ledgerline:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ledgerline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: ledger-line
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
